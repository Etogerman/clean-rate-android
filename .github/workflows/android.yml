name: Проверка Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Тесты, анализ и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Получить исходный код
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Настроить JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Проверить Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Проверить проект
        run: ./gradlew --no-daemon test lint assembleDebug
